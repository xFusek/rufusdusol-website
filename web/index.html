<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="description"
    content="A responsive Flutter Web landing page inspired by RÜFÜS DU SOL."
  >

  <!-- iOS meta tags and icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RÜFÜS DU SOL">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>RÜFÜS DU SOL</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ffffff;
      opacity: 1;
      transition: opacity 300ms ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading img {
      width: 120px;
      height: 120px;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <div id="loading" role="status" aria-label="Loading application">
    <img src="loading.gif" alt="">
  </div>

  <script>
    window.addEventListener(
      'flutter-first-frame',
      () => {
        const loading = document.getElementById('loading');

        if (!loading) {
          return;
        }

        loading.classList.add('hidden');

        setTimeout(() => {
          loading.remove();
        }, 300);
      },
      { once: true }
    );
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
